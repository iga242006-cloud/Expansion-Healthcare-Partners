<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">
  <rect width="480" height="360" fill="#F0F8FF"/>
  <circle cx="60" cy="60" r="100" fill="#2B7BB9" fill-opacity=".07"/>
  <circle cx="440" cy="310" r="80" fill="#14B8A6" fill-opacity=".07"/>

  <!-- Document / contract -->
  <rect x="130" y="60" width="200" height="260" rx="10" fill="white" stroke="#E5E7EB" stroke-width="2" filter="url(#shadow)"/>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1A1A2E" flood-opacity=".10"/>
    </filter>
  </defs>

  <!-- Doc header -->
  <rect x="130" y="60" width="200" height="44" rx="10" fill="#2B7BB9"/>
  <rect x="148" y="104" width="0" height="0"/> <!-- corner fix -->
  <rect x="130" y="88" width="200" height="16" fill="#2B7BB9"/>
  <text x="230" y="87" font-family="Georgia, serif" font-size="12" fill="white" font-weight="bold" text-anchor="middle">Employment Agreement</text>

  <!-- Doc lines -->
  <rect x="150" y="124" width="160" height="8" rx="4" fill="#E5E7EB"/>
  <rect x="150" y="142" width="130" height="8" rx="4" fill="#E5E7EB"/>
  <rect x="150" y="160" width="145" height="8" rx="4" fill="#E5E7EB"/>
  <rect x="150" y="178" width="100" height="8" rx="4" fill="#E5E7EB"/>

  <!-- Section heading -->
  <rect x="150" y="202" width="80" height="8" rx="4" fill="#2B7BB9" fill-opacity=".35"/>
  <rect x="150" y="220" width="160" height="8" rx="4" fill="#E5E7EB"/>
  <rect x="150" y="238" width="120" height="8" rx="4" fill="#E5E7EB"/>
  <rect x="150" y="256" width="140" height="8" rx="4" fill="#E5E7EB"/>

  <!-- Signature line -->
  <line x1="150" y1="296" x2="250" y2="296" stroke="#1A1A2E" stroke-opacity=".2" stroke-width="1.5"/>
  <!-- Signature squiggle -->
  <path d="M155 296 Q165 284 178 292 Q192 300 205 288 Q215 280 228 290" stroke="#D6215E" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Check mark -->
  <circle cx="286" cy="282" r="16" fill="#14B8A6" fill-opacity=".15" stroke="#14B8A6" stroke-width="2"/>
  <path d="M278 282 L284 288 L296 274" stroke="#14B8A6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Briefcase icon top right -->
  <rect x="360" y="80" width="72" height="60" rx="8" fill="white" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="375" y="72" width="42" height="16" rx="5" fill="none" stroke="#2B7BB9" stroke-width="2"/>
  <line x1="360" y1="108" x2="432" y2="108" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="396" cy="108" r="5" fill="#2B7BB9"/>

  <!-- Map pin bottom left -->
  <circle cx="90" cy="230" r="28" fill="white" stroke="#E5E7EB" stroke-width="2"/>
  <path d="M90 210 C80 210 72 218 72 228 C72 242 90 258 90 258 C90 258 108 242 108 228 C108 218 100 210 90 210Z" fill="#D6215E" fill-opacity=".8"/>
  <circle cx="90" cy="228" r="7" fill="white"/>

  <!-- Label -->
  <rect x="48" y="16" width="240" height="36" rx="8" fill="#1A1A2E" fill-opacity=".85"/>
  <text x="68" y="39" font-family="Georgia, serif" font-size="14" fill="white" font-weight="bold">Placement &amp; Contract Consulting</text>
</svg>
